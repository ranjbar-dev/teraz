name: taraz

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://taraz:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/taraz
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
  WEB_ORIGIN: https://${DOMAIN:-ranjbar.dev}
  COOKIE_SECURE: "true"
  LOCAL_SANDBOX: "false"

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: taraz
      POSTGRES_DB: taraz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U taraz -d taraz"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  migrate:
    image: taraz-migrate:${IMAGE_TAG:-local}
    build:
      context: ./backend
      target: migrate
    environment:
      <<: *api-env
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  backend:
    image: taraz-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      <<: *api-env
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      TRUST_PROXY: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  frontend:
    image: taraz-frontend:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-ranjbar.dev}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    logging: *logging

volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
